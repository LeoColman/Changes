name: Release

# Uma tag vMAJOR.MINOR.PATCH publica uma release com o APK assinado:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check (compile, Detekt, lint, tests, Kover, manifest)
        run: ./gradlew check --continue

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CHANGES_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/changes-release.jks"
          echo "CHANGES_KEYSTORE_FILE=$RUNNER_TEMP/changes-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          CHANGES_KEYSTORE_PASSWORD: ${{ secrets.CHANGES_KEYSTORE_PASSWORD }}
          CHANGES_KEY_ALIAS: ${{ secrets.CHANGES_KEY_ALIAS }}
          CHANGES_KEY_PASSWORD: ${{ secrets.CHANGES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PappVersionName=${{ steps.version.outputs.version }}

      - name: Verify signature and name the APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT="changes-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f "$RUNNER_TEMP/changes-release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "changes-$VERSION.apk" "changes-$VERSION.apk.sha256" \
            --title "Changes $VERSION" --generate-notes --verify-tag
