name: Mutation testing

on:
  pull_request:
    paths:
      - 'core/**'
      - 'app/**'
      - 'gradle/libs.versions.toml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Pitest with per-package gates (:core and the JVM-only logic of :app)
        run: ./gradlew pitestAll
      - name: Publish the scores
        if: always()
        run: |
          cat core/build/reports/pitest/package-scores.md >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/pitest/module-score.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report
          path: |
            core/build/reports/pitest/
            app/build/reports/pitest/
