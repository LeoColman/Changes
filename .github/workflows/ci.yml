name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check (compile, Detekt, lint, tests, Kover, manifest)
        run: ./gradlew check --continue -Dchanges.roundtrip.iterations=1000
      - name: Compose stability report
        run: ./gradlew :app:assembleRelease -PcomposeReports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports/
            core/build/reports/
            app/build/reports/
            app/build/compose_compiler/
